<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Converter - Extract to CSV / Excel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a24;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-glow: #6366f180;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2a2a3a;
      --success: #22c55e;
      --error: #ef4444;
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.08);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px var(--accent-glow); }
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139,92,246,0.1), transparent),
        radial-gradient(circle at 20% 80%, rgba(99,102,241,0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .bg-animation {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(99,102,241,0.03) 60deg, transparent 120deg);
      animation: gradient-shift 15s linear infinite;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: var(--accent-primary);
      top: 10%;
      left: 20%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: var(--accent-secondary);
      bottom: 20%;
      right: 15%;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 200px;
      height: 200px;
      background: #4f46e5;
      top: 60%;
      left: 70%;
      animation-delay: -5s;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      box-shadow: 
        0 0 0 1px var(--glass-border),
        0 25px 50px rgba(0,0,0,0.5),
        inset 0 1px 0 var(--glass);
      animation: fadeInUp 0.6s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary), #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--glass);
      position: relative;
      overflow: hidden;
    }

    .dropzone::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.1), transparent);
      transition: none;
    }

    .dropzone:hover::before, .dropzone.dragover::before {
      animation: shimmer 1s;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent-primary);
      background: rgba(99,102,241,0.05);
    }

    .dropzone.has-file {
      border-style: solid;
      border-color: var(--accent-primary);
      background: rgba(99,102,241,0.08);
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 48px;
      margin-bottom: 16px;
      transition: transform 0.3s;
    }

    .dropzone:hover .drop-icon {
      transform: translateY(-4px);
    }

    .drop-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .drop-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .file-info {
      display: none;
      align-items: center;
      gap: 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      animation: scaleIn 0.3s ease;
    }

    .file-info.show {
      display: flex;
    }

    .file-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .remove-btn {
      width: 32px;
      height: 32px;
      background: rgba(239,68,68,0.1);
      border: none;
      border-radius: 8px;
      color: var(--error);
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .remove-btn:hover {
      background: rgba(239,68,68,0.2);
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 28px 0 14px;
    }

    .format-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .format-option {
      position: relative;
    }

    .format-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .format-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 14px;
      font-weight: 500;
      background: var(--glass);
    }

    .format-label:hover {
      border-color: var(--accent-primary);
      background: rgba(99,102,241,0.1);
    }

    .format-option input:checked + .format-label {
      border-color: var(--accent-primary);
      background: rgba(99,102,241,0.15);
      color: #a5b4fc;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .format-icon {
      font-size: 22px;
    }

    .convert-btn {
      width: 100%;
      margin-top: 32px;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .convert-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: none;
    }

    .convert-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99,102,241,0.4);
    }

    .convert-btn:hover:not(:disabled)::before {
      animation: shimmer 0.6s;
    }

    .convert-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      animation: fadeInUp 0.3s ease;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: rgba(59,130,246,0.1);
      color: #60a5fa;
      border: 1px solid rgba(59,130,246,0.3);
    }

    .status.error {
      background: rgba(239,68,68,0.1);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3);
    }

    .status.success {
      background: rgba(34,197,94,0.1);
      color: #86efac;
      border: 1px solid rgba(34,197,94,0.3);
    }

    .progress-bar {
      height: 3px;
      background: #1e293b;
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.show {
      display: block;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 2px;
      transition: width 0.3s;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1s infinite;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }
      
      h1 {
        font-size: 22px;
      }
      
      .format-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">📄</div>
      <div>
        <h1>PDF to Excel & CSV</h1>
        <div class="subtitle">Extract tables & text from any PDF instantly</div>
      </div>
    </div>

    <form id="convertForm" method="post" enctype="multipart/form-data" action="/convert/">
      {% csrf_token %}

      <div class="dropzone" id="dropzone">
        <input type="file" name="pdf_file" id="pdfInput" accept=".pdf" required />
        <div class="drop-icon">📁</div>
        <div class="drop-text">Drop your PDF here</div>
        <div class="drop-sub">or click to browse &nbsp;·&nbsp; Max 20 MB</div>
      </div>

      <div class="file-info" id="fileInfo">
        <div class="file-icon">📑</div>
        <div class="file-details">
          <div class="file-name" id="fileName">—</div>
          <div class="file-size" id="fileSize">—</div>
        </div>
        <button type="button" class="remove-btn" id="removeBtn" title="Remove">✕</button>
      </div>

      <div class="section-label">Output Format</div>
      <div class="format-group">
        <div class="format-option">
          <input type="radio" name="format" id="fmtCsv" value="csv" checked />
          <label class="format-label" for="fmtCsv">
            <span class="format-icon">📋</span> CSV
          </label>
        </div>
        <div class="format-option">
          <input type="radio" name="format" id="fmtXlsx" value="excel" />
          <label class="format-label" for="fmtXlsx">
            <span class="format-icon">📊</span> Excel (.xlsx)
          </label>
        </div>
      </div>

      <button type="submit" class="convert-btn" id="convertBtn" disabled>
        Convert to {{ request.POST.format|default:'CSV/Excel' }}
      </button>
    </form>

    <div class="status" id="status"></div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('pdfInput');
    const dropzone = document.getElementById('dropzone');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const removeBtn = document.getElementById('removeBtn');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.querySelector('.progress-fill');
    const form = document.getElementById('convertForm');

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function showFile(file) {
      fileName.textContent = file.name;
      fileSize.textContent = formatBytes(file.size);
      fileInfo.classList.add('show');
      dropzone.classList.add('has-file');
      convertBtn.disabled = false;
      convertBtn.textContent = 'Convert PDF';
    }

    function clearFile() {
      input.value = '';
      fileInfo.classList.remove('show');
      dropzone.classList.remove('has-file');
      convertBtn.disabled = true;
      convertBtn.textContent = 'Convert PDF';
      setStatus('', '');
    }

    input.addEventListener('change', () => {
      if (input.files[0]) showFile(input.files[0]);
    });

    removeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      clearFile();
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.name.toLowerCase().endsWith('.pdf')) {
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        showFile(file);
      } else {
        setStatus('Please drop a valid PDF file.', 'error');
      }
    });

    function setStatus(msg, type) {
      status.textContent = msg;
      progressBar.classList.toggle('show', type === 'loading');
      status.className = 'status' + (type ? ' show ' + type : '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!input.files[0]) return;

      convertBtn.disabled = true;
      setStatus('⏳ Converting your PDF, please wait…', 'loading');
      progressFill.style.width = '30%';

      const formData = new FormData(form);

      try {
        const response = await fetch('/convert/', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Server error');
        }

        progressFill.style.width = '70%';

        const blob = await response.blob();
        const contentDisposition = response.headers.get('Content-Disposition');
        let dlName = 'converted_output';
        if (contentDisposition) {
          const match = contentDisposition.match(/filename="(.+?)"/);
          if (match) dlName = match[1];
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = dlName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        progressFill.style.width = '100%';
        setStatus('✅ Conversion complete! Your download started.', 'success');
      } catch (err) {
        setStatus('❌ ' + err.message, 'error');
      } finally {
        setTimeout(() => {
          convertBtn.disabled = !input.files[0];
        }, 500);
      }
    });
  </script>
</body>
</html>
